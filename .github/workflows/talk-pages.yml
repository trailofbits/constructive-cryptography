name: Publish talk to GitHub Pages

run-name: Publish talk (${{ inputs.branch || github.ref_name }})

on:
  push:
    branches: [swiss-cryptoday-2026]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish (replaces the live talk)
        required: true
        default: swiss-cryptoday-2026
        type: string

permissions:
  contents: read

# Manual and automatic runs publish to one site. Finish an active deployment
# before starting another; do not cancel a deployment while Pages is updating.
concurrency:
  group: talk-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/swiss-cryptoday-2026')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the selected talk source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false

      - name: Check that this branch contains the talk project
        run: |
          test -f informalization/scripts/build-swiss-crypto-day.sh
          test -f informalization/slides/lean-toolchain
          test -f informalization/slides/MainDraftTalk.lean
          git rev-parse HEAD

      - name: Cache Lean build dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .lake/build
            informalization/.lake
            informalization/slides/.lake
          key: talk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/lean-toolchain', '**/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            talk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/lean-toolchain', '**/lake-manifest.json') }}-

      - name: Install Lean and fetch the pinned Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: informalization
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      # Elan selects each package's own lean-toolchain, including the different
      # Verso toolchain in informalization/slides. Never run lake update here.
      - name: Check the CBC proof and build the complete static deck
        run: bash informalization/scripts/build-swiss-crypto-day.sh

      - name: Validate the output and locked dependencies
        run: |
          test -s informalization/slides/_draft_talk/index.html
          git diff --exit-code -- '**/lake-manifest.json' '**/lean-toolchain'

      - name: Upload only the generated website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: informalization/slides/_draft_talk

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
